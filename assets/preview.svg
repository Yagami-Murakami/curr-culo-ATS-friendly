<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FB"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6DF6"/>
      <stop offset="1" stop-color="#1FC7D4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#14264A" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1190" cy="90" r="250" fill="#CFE1FF" opacity=".42"/>
  <rect x="70" y="55" width="46" height="46" rx="14" fill="url(#brand)"/>
  <text x="93" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">JM</text>
  <text x="130" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1630">JobMatch</text>
  <text x="130" y="96" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#69758D">ATS</text>

  <text x="72" y="190" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#2F6DF6">CURRÍCULO OTIMIZADO SEM INVENTAR EXPERIÊNCIA</text>
  <text x="72" y="255" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#0B1630">Descubra por que seu currículo</text>
  <text x="72" y="315" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#0B1630">pode estar sendo barrado pelo ATS.</text>
  <text x="72" y="365" font-family="Arial,sans-serif" font-size="20" fill="#69758D">Compare currículo e vaga, identifique palavras-chave e gere uma versão mais clara.</text>
  <rect x="72" y="405" width="205" height="54" rx="14" fill="#2F6DF6"/>
  <text x="174" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Analisar meu currículo</text>

  <g filter="url(#shadow)">
    <rect x="765" y="150" width="560" height="330" rx="28" fill="#fff" stroke="#DFE5EF"/>
    <text x="805" y="195" font-family="Arial,sans-serif" font-size="16" fill="#69758D">Resultado da análise</text>
    <circle cx="880" cy="300" r="74" fill="#EDF1F7"/>
    <path d="M880 226 A74 74 0 1 1 812 329" fill="none" stroke="#2F6DF6" stroke-width="15" stroke-linecap="round"/>
    <text x="880" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#0B1630">78%</text>
    <text x="990" y="275" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0B1630">Bom alinhamento</text>
    <text x="990" y="307" font-family="Arial,sans-serif" font-size="16" fill="#69758D">Seu currículo cobre boa parte da vaga.</text>
    <rect x="990" y="335" width="95" height="32" rx="16" fill="#E9F8F1"/><text x="1037" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">Linux</text>
    <rect x="1095" y="335" width="92" height="32" rx="16" fill="#E9F8F1"/><text x="1141" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">Git</text>
    <rect x="1197" y="335" width="84" height="32" rx="16" fill="#FFF0F2"/><text x="1239" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C74755">AWS</text>
  </g>

  <text x="72" y="560" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2F6DF6">RESULTADO</text>
  <text x="72" y="605" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#0B1630">Seu diagnóstico ATS</text>

  <g filter="url(#shadow)">
    <rect x="72" y="645" width="390" height="185" rx="22" fill="#fff" stroke="#DFE5EF"/>
    <text x="100" y="685" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1630">Aderência à vaga</text>
    <rect x="100" y="708" width="330" height="12" rx="6" fill="#EDF1F7"/>
    <rect x="100" y="708" width="257" height="12" rx="6" fill="url(#brand)"/>
    <text x="100" y="755" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Boa aderência. Revise apenas lacunas reais.</text>
    <text x="100" y="798" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630">9</text>
    <text x="145" y="798" font-family="Arial,sans-serif" font-size="12" fill="#69758D">encontradas</text>
    <text x="260" y="798" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630">3</text>
    <text x="300" y="798" font-family="Arial,sans-serif" font-size="12" fill="#69758D">faltando</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="486" y="645" width="390" height="185" rx="22" fill="#fff" stroke="#DFE5EF"/>
    <text x="514" y="685" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1630">Palavras encontradas</text>
    <rect x="514" y="712" width="92" height="32" rx="16" fill="#E9F8F1"/><text x="560" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">Windows</text>
    <rect x="616" y="712" width="78" height="32" rx="16" fill="#E9F8F1"/><text x="655" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">Linux</text>
    <rect x="704" y="712" width="80" height="32" rx="16" fill="#E9F8F1"/><text x="744" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">Redes</text>
    <rect x="514" y="755" width="78" height="32" rx="16" fill="#E9F8F1"/><text x="553" y="776" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">VPN</text>
    <rect x="602" y="755" width="67" height="32" rx="16" fill="#E9F8F1"/><text x="635" y="776" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#138A63">Git</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="645" width="425" height="185" rx="22" fill="#fff" stroke="#DFE5EF"/>
    <text x="928" y="685" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1630">Palavras ausentes</text>
    <rect x="928" y="712" width="76" height="32" rx="16" fill="#FFF0F2"/><text x="966" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C74755">AWS</text>
    <rect x="1014" y="712" width="74" height="32" rx="16" fill="#FFF0F2"/><text x="1051" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C74755">ITIL</text>
    <rect x="1098" y="712" width="160" height="32" rx="16" fill="#FFF0F2"/><text x="1178" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C74755">Active Directory</text>
    <text x="928" y="782" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Só inclua uma palavra se ela representar algo que você realmente sabe ou fez.</text>
  </g>
</svg>