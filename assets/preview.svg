<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F8FC"/><stop offset="1" stop-color="#EAF1FF"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2F6DF6"/><stop offset="1" stop-color="#1FC7D4"/></linearGradient>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="12" stdDeviation="16" flood-color="#13254A" flood-opacity=".10"/></filter>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="1400" height="82" fill="#F8FAFD" opacity=".96"/>
<rect x="62" y="21" width="40" height="40" rx="12" fill="url(#brand)"/>
<text x="82" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">JM</text>
<text x="116" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1630">JobMatch</text>
<text x="116" y="58" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#69758D">ATS</text>
<text x="1060" y="48" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Analisar</text>
<text x="1140" y="48" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Como funciona</text>
<text x="1260" y="48" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Segurança</text>

<text x="70" y="145" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#2F6DF6">CURRÍCULO OTIMIZADO SEM INVENTAR EXPERIÊNCIA</text>
<text x="70" y="205" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="#0B1630">Descubra por que seu currículo</text>
<text x="70" y="260" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="#0B1630">pode estar sendo barrado pelo ATS.</text>
<text x="70" y="306" font-family="Arial,sans-serif" font-size="18" fill="#69758D">Compare currículo e vaga, identifique palavras-chave e melhore a apresentação.</text>
<rect x="70" y="338" width="205" height="48" rx="13" fill="#2F6DF6"/>
<text x="172" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Analisar meu currículo</text>
<rect x="290" y="338" width="180" height="48" rx="13" fill="#fff" stroke="#DDE4EF"/>
<text x="380" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0B1630">Entender o processo</text>

<g filter="url(#s)">
  <rect x="790" y="126" width="540" height="280" rx="24" fill="#fff" stroke="#DFE5EF"/>
  <text x="825" y="168" font-family="Arial,sans-serif" font-size="14" fill="#69758D">Resultado da análise</text>
  <text x="825" y="230" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#0B1630">78%</text>
  <text x="930" y="218" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1630">Bom alinhamento</text>
  <text x="930" y="246" font-family="Arial,sans-serif" font-size="14" fill="#69758D">Seu currículo já cobre boa parte da vaga.</text>
  <rect x="825" y="288" width="88" height="31" rx="16" fill="#E9F8F1"/><text x="869" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Linux</text>
  <rect x="923" y="288" width="86" height="31" rx="16" fill="#E9F8F1"/><text x="966" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">TCP/IP</text>
  <rect x="1019" y="288" width="68" height="31" rx="16" fill="#E9F8F1"/><text x="1053" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Git</text>
  <rect x="1097" y="288" width="70" height="31" rx="16" fill="#FFF0F2"/><text x="1132" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C74755">AWS</text>
  <rect x="1177" y="288" width="68" height="31" rx="16" fill="#FFF0F2"/><text x="1211" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C74755">ITIL</text>
  <rect x="825" y="348" width="445" height="10" rx="5" fill="#EDF1F7"/>
  <rect x="825" y="348" width="347" height="10" rx="5" fill="url(#brand)"/>
</g>

<text x="70" y="490" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#2F6DF6">RESULTADO</text>
<text x="70" y="535" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#0B1630">Seu diagnóstico ATS</text>

<g filter="url(#s)">
  <rect x="70" y="575" width="390" height="245" rx="22" fill="#fff" stroke="#DFE5EF"/>
  <text x="100" y="618" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1630">Aderência à vaga</text>
  <rect x="100" y="645" width="330" height="10" rx="5" fill="#EDF1F7"/>
  <rect x="100" y="645" width="257" height="10" rx="5" fill="url(#brand)"/>
  <text x="100" y="686" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Boa aderência. Revise somente lacunas reais.</text>
  <rect x="100" y="720" width="92" height="66" rx="13" fill="#F7F9FC"/><text x="146" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630">9</text><text x="146" y="772" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#69758D">encontradas</text>
  <rect x="205" y="720" width="92" height="66" rx="13" fill="#F7F9FC"/><text x="251" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630">3</text><text x="251" y="772" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#69758D">faltando</text>
  <rect x="310" y="720" width="92" height="66" rx="13" fill="#F7F9FC"/><text x="356" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#0B1630">12</text><text x="356" y="772" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#69758D">relevantes</text>
</g>

<g filter="url(#s)">
  <rect x="485" y="575" width="390" height="245" rx="22" fill="#fff" stroke="#DFE5EF"/>
  <text x="515" y="618" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1630">Palavras encontradas</text>
  <rect x="515" y="650" width="92" height="31" rx="16" fill="#E9F8F1"/><text x="561" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Windows</text>
  <rect x="617" y="650" width="78" height="31" rx="16" fill="#E9F8F1"/><text x="656" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Linux</text>
  <rect x="705" y="650" width="80" height="31" rx="16" fill="#E9F8F1"/><text x="745" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Redes</text>
  <rect x="515" y="693" width="76" height="31" rx="16" fill="#E9F8F1"/><text x="553" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">VPN</text>
  <rect x="601" y="693" width="64" height="31" rx="16" fill="#E9F8F1"/><text x="633" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Git</text>
  <rect x="675" y="693" width="104" height="31" rx="16" fill="#E9F8F1"/><text x="727" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#138A63">Suporte</text>
</g>

<g filter="url(#s)">
  <rect x="900" y="575" width="430" height="245" rx="22" fill="#fff" stroke="#DFE5EF"/>
  <text x="930" y="618" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0B1630">Palavras ausentes</text>
  <rect x="930" y="650" width="70" height="31" rx="16" fill="#FFF0F2"/><text x="965" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C74755">AWS</text>
  <rect x="1010" y="650" width="70" height="31" rx="16" fill="#FFF0F2"/><text x="1045" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C74755">ITIL</text>
  <rect x="1090" y="650" width="152" height="31" rx="16" fill="#FFF0F2"/><text x="1166" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C74755">Active Directory</text>
  <text x="930" y="725" font-family="Arial,sans-serif" font-size="13" fill="#69758D">Só inclua termos que representem</text>
  <text x="930" y="748" font-family="Arial,sans-serif" font-size="13" fill="#69758D">experiências ou conhecimentos reais.</text>
